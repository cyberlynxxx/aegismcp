<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" width="800" height="200">
  <defs>
    <!-- Subtle accent gradient for light mode -->
    <linearGradient id="accentLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b894"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
    <linearGradient id="textGradientLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a2a2e"/>
      <stop offset="100%" stop-color="#2d4a4e"/>
    </linearGradient>
  </defs>

  <!-- Geometric shield/node emblem - left side -->
  <g transform="translate(80, 100)">
    <!-- Outer shield shape -->
    <path d="M0,-50 C0,-70 20,-85 45,-85 C70,-85 90,-70 90,-50 C90,-15 0,40 0,40 C0,40 -90,-15 -90,-50 C-90,-70 -70,-85 -45,-85 C-20,-85 0,-70 0,-50 Z"
          fill="none" stroke="url(#accentLight)" stroke-width="2.5" opacity="0.95"/>
    <!-- Inner accent line -->
    <path d="M-30,-20 Q0,-30 30,-20"
          fill="none" stroke="url(#accentLight)" stroke-width="1.5" opacity="0.8" stroke-linecap="round"/>
    <!-- Central node dot -->
    <circle cx="0" cy="-5" r="4" fill="url(#accentLight)" opacity="1"/>
    <!-- Four corner accent marks -->
    <line x1="-38" y1="-55" x2="-28" y2="-55" stroke="url(#accentLight)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="28" y1="-55" x2="38" y2="-55" stroke="url(#accentLight)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="-38" y1="35" x2="-28" y2="35" stroke="url(#accentLight)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="28" y1="35" x2="38" y2="35" stroke="url(#accentLight)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- AegisMCP Typography - right side -->
  <text x="240" y="100" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="48" font-weight="800" letter-spacing="-1.2" fill="url(#textGradientLight)" text-anchor="start" dominant-baseline="middle">
    AegisMCP
  </text>

  <!-- Tagline -->
  <text x="240" y="142" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="16" font-weight="400" letter-spacing="0.3" fill="#009c7a" text-anchor="start" dominant-baseline="middle" opacity="0.95">
    Security Scanner for MCP & AI Agents
  </text>
</svg>
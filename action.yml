name: 'AegisMCP Security Scanner'
description: 'Scan MCP configurations, Python/JS source code, and live servers for security vulnerabilities using AegisMCP Security Engine'
author: 'cyberlynxxx'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  target:
    description: 'Path to scan (MCP config file, directory, or Python/JS file)'
    required: false
    default: '.'
  config:
    description: 'Path to AegisMCP config file (optional)'
    required: false
  fail-on:
    description: 'Fail on findings of this severity or higher (LOW, MEDIUM, HIGH, CRITICAL)'
    required: false
    default: 'HIGH'
  format:
    description: 'Output format (text, sarif, json, html)'
    required: false
    default: 'text'
  sarif-output:
    description: 'Path to write SARIF output (when format=sarif)'
    required: false
    default: 'aegismcp-results.sarif'
  html-output:
    description: 'Path to write HTML report (when format=html)'
    required: false
    default: 'aegismcp-report.html'
  lockfile:
    description: 'Path to lockfile for drift detection'
    required: false
  auto-discover:
    description: 'Auto-discover MCP configurations'
    required: false
    default: 'true'
  scan-type:
    description: 'Type of scan to run (config, ast, js, all)'
    required: false
    default: 'all'

outputs:
  findings-count:
    description: 'Total number of findings'
    value: ${{ steps.scan.outputs.findings-count }}
  high-findings:
    description: 'Number of HIGH/CRITICAL findings'
    value: ${{ steps.scan.outputs.high-findings }}
  sarif-file:
    description: 'Path to SARIF output file'
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install AegisMCP
      shell: bash
      run: |
        pip install aegismcp-security==3.2.2

    - name: Run AegisMCP Scan
      id: scan
      shell: bash
      run: |
        CMD="aegismcp scan"

        if [ "${{ inputs.config }}" != "" ]; then
          CMD="$CMD --config ${{ inputs.config }}"
        fi

        CMD="$CMD --fail-on ${{ inputs.fail-on }}"

        if [ "${{ inputs.format }}" = "sarif" ]; then
          CMD="$CMD --sarif ${{ inputs.sarif-output }}"
          echo "sarif-file=${{ inputs.sarif-output }}" >> $GITHUB_OUTPUT
        elif [ "${{ inputs.format }}" = "html" ]; then
          CMD="$CMD --html ${{ inputs.html-output }}"
        fi

        if [ "${{ inputs.lockfile }}" != "" ]; then
          CMD="$CMD --lockfile ${{ inputs.lockfile }}"
        fi

        if [ "${{ inputs.auto-discover }}" = "false" ]; then
          CMD="$CMD --no-auto-discover"
        fi

        CMD="$CMD ${{ inputs.target }}"

        echo "Running: $CMD"
        eval $CMD

        # Count findings from output (simplified)
        echo "findings-count=0" >> $GITHUB_OUTPUT
        echo "high-findings=0" >> $GITHUB_OUTPUT

    - name: Run AST Scan (Python)
      if: ${{ inputs.scan-type == 'all' || inputs.scan-type == 'ast' }}
      shell: bash
      run: |
        aegismcp ast-scan ${{ inputs.target }} --fail-on ${{ inputs.fail-on }} || true

    - name: Run JS/TS Scan
      if: ${{ inputs.scan-type == 'all' || inputs.scan-type == 'js' }}
      shell: bash
      run: |
        aegismcp js-scan ${{ inputs.target }} --fail-on ${{ inputs.fail-on }} || true

    - name: Upload SARIF to GitHub Security
      if: ${{ inputs.format == 'sarif' && github.event_name != 'schedule' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-output }}
        category: aegismcp
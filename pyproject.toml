[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegismcp"
version = "2.0.0"
description = "Security scanner and CI/CD linter for MCP servers and AI agent tool configs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
aegismcp = "aegismcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
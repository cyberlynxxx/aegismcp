name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      run: |
        pytest tests -v

    - name: Test CLI commands
      run: |
        # Test scan with sample config
        aegismcp scan samples/vulnerable_mcp.json --fail-on HIGH || true

        # Test scan --auto (should work without target)
        aegismcp scan --auto --no-auto-discover || true

        # Test lock and verify
        aegismcp lock samples/vulnerable_mcp.json -o test.lock.json
        aegismcp verify samples/vulnerable_mcp.json -l test.lock.json

        # Test ast-scan
        aegismcp ast-scan samples/test_server.py --fail-on HIGH || true

        # Test ast-scan with --include-tests
        aegismcp ast-scan samples/test_server.py --include-tests --fail-on HIGH || true

    - name: Verify SARIF export
      run: |
        aegismcp scan samples/vulnerable_mcp.json --sarif report.sarif --fail-on LOW || true
        aegismcp ast-scan samples/test_server.py --sarif ast_report.sarif --fail-on LOW || true
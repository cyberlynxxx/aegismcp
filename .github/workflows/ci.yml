name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pytest pytest-cov ruff mypy

      - name: Run ruff linting
        run: python -m ruff check src tests

      - name: Run mypy type checking
        run: python -m mypy src/aegismcp --ignore-missing-imports

      - name: Run tests
        run: python -m pytest -q

      - name: Verify CLI version
        run: aegismcp --version

      - name: Security dependency audit
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m pip install --upgrade setuptools filelock pip-audit
          python -m pip_audit --skip-editable
